<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration - BMS Control Centre</title>
</head>

<body>

    <h1>BMS Control Centre</h1>

    <h2>BMS Configuration</h2>

    <label>Over Voltage Limit</label><br>
    <input type="number" value="15.0"> V

    <br><br>

    <label>Under Voltage Limit</label><br>
    <input type="number" value="10.0"> V

    <br><br>

    <label>Over Current Limit</label><br>
    <input type="number" value="10.0"> A

    <br><br>

    <label>Over Temperature Limit</label><br>
    <input type="number" value="60"> °C

    <br><br>

    <label>Cell Imbalance Limit</label><br>
    <input type="number" value="0.05"> V

    <br><br>

    <button>Save Configuration</button>

</body>
</html>
