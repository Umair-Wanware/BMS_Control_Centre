<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charts - BMS Control Centre</title>
</head>

<body>

    <h1>BMS Control Centre</h1>

    <h2>Battery Charts</h2>

    <h3>Voltage vs Time</h3>
    <canvas id="voltageChart" width="600" height="250"></canvas>

    <h3>Current vs Time</h3>
    <canvas id="currentChart" width="600" height="250"></canvas>

    <h3>Temperature vs Time</h3>
    <canvas id="temperatureChart" width="600" height="250"></canvas>

    <h3>State of Charge (SOC) vs Time</h3>
    <canvas id="socChart" width="600" height="250"></canvas>

</body>
</html>
