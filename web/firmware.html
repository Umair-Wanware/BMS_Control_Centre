<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firmware Update - BMS Control Centre</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    html, body { height: 100vh; width: 100vw; overflow: hidden; background-color: #0b111e; color: #ffffff; }
    body { display: flex; }

    /* Sidebar */
    .sidebar { width: 240px; height: 100vh; background-color: #0f172a; padding: 16px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid #1e293b; }
    .brand-box { background-color: #ffffff; color: #0f172a; padding: 12px; border-radius: 12px; margin-bottom: 12px; }
    .brand-box h3 { font-size: 14px; font-weight: 700; }
    .brand-box p { font-size: 11px; color: #64748b; }
    .nav-btn { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; color: #94a3b8; text-decoration: none; font-size: 13px; font-weight: 500; transition: 0.2s; }
    .nav-btn.active { background-color: #0e3a40; color: #38bdf8; }
    .nav-btn:hover:not(.active) { background-color: #1e293b; color: #ffffff; }

    /* Main Area */
    .main-content { flex: 1; height: 100vh; padding: 20px 28px; display: flex; flex-direction: column; gap: 16px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .page-title h2 { font-size: 22px; }
    .tag { background-color: #1e293b; padding: 6px 14px; border-radius: 20px; font-size: 12px; color: #cbd5e1; }

    /* Firmware Content */
    .firmware-container { display: flex; flex-direction: column; gap: 20px; max-width: 600px; margin-top: 20px; }
    .card { background-color: #111a2e; border: 1px solid #1e293b; border-radius: 16px; padding: 24px; }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; }
    .value { color: #38bdf8; font-weight: 600; }

    .btn { background-color: #38bdf8; color: #0b111e; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn:hover { background-color: #7dd3fc; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="brand-box">
      <h3>BMS Control Centre</h3>
      <p>ESP32 Control Hub</p>
    </div>
    <a href="index.html" class="nav-btn">Dashboard</a>
    <a href="telemetry.html" class="nav-btn">Telemetry</a>
    <a href="charts.html" class="nav-btn">Charts</a>
    <a href="firmware.html" class="nav-btn active">Firmware Update</a>
    <a href="config.html" class="nav-btn">Configuration</a>
    <a href="logs.html" class="nav-btn">Logs</a>
    <a href="diagnostics.html" class="nav-btn">Diagnostics</a>
    <a href="settings.html" class="nav-btn">Settings</a>
  </div>

  <!-- Content -->
  <div class="main-content">
    <div class="top-bar">
      <div class="page-title"><h2>Firmware Update</h2></div>
      <span id="status-tag" class="tag">🔴 Offline</span>
    </div>

    <div class="firmware-container">
      <div class="card">
        <div class="info-row"><span>Current Version:</span> <span class="value">v1.2.4</span></div>
        <div class="info-row"><span>Last Checked:</span> <span class="value">2 Hours ago</span></div>
        <div class="info-row"><span>Status:</span> <span class="value" style="color: #4ade80;">Up to date</span></div>
        <button class="btn">Check for Updates</button>
      </div>
    </div>
  </div>

  <!-- Sync Script -->
  <script>
    function updateStatus() {
      const tag = document.getElementById('status-tag');
      if (!tag) return;
      let status = localStorage.getItem('systemStatus');
      if (status === 'online') {
        tag.innerHTML = '🟢 Online';
        tag.style.color = '#4ade80';
        tag.style.backgroundColor = '#143823';
      } else {
        tag.innerHTML = '🔴 Offline';
        tag.style.color = '#f87171';
        tag.style.backgroundColor = '#1e293b';
      }
    }
    window.onload = updateStatus;
    window.addEventListener('storage', updateStatus);
  </script>
</body>
</html>
