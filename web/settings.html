<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - BMS Control Centre</title>
</head>

<body>

    <h1>BMS Control Centre</h1>

    <h2>Settings</h2>

    <h3>Device Settings</h3>

    <label>Device Name</label><br>
    <input type="text" value="STM32 BMS">

    <br><br>

    <label>Wi-Fi Network</label><br>
    <input type="text" value="Home_Network">

    <br><br>

    <label>Refresh Interval</label><br>
    <select>
        <option>1 Second</option>
        <option selected>2 Seconds</option>
        <option>5 Seconds</option>
        <option>10 Seconds</option>
    </select>

    <br><br>

    <label>Temperature Unit</label><br>
    <select>
        <option selected>Celsius (°C)</option>
        <option>Fahrenheit (°F)</option>
    </select>

    <br><br>

    <label>
        <input type="checkbox">
        Simulation Mode
    </label>

    <br><br>

    <button>Save Settings</button>

</body>
</html>
